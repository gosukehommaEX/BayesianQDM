url: https://gosukehommaEX.github.io/BayesianQDM/
template:
  bootstrap: 5
  includes:
    after_body: |
      <script>
        window.MathJax = {
          loader: {load: ['[tex]/boldsymbol']},
          tex: {
            packages: {'[+]': ['boldsymbol']},
            inlineMath: [['\\(', '\\)']],
            displayMath: [['$$', '$$']]
          }
        };
      </script>
      <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>

home:
  title: BayesianQDM
  description: >
    Bayesian Quantitative Decision-Making Framework for Binary, Continuous and Time-to-Event Endpoints.
  logo: man/figures/logo.png

reference:
- title: Designs
  desc: Specification of a proof-of-concept study
  contents:
  - design_binary
  - design_continuous
  - design_binary2
  - design_continuous2
  - design_tte
  - conduct_tte

- title: Building a design step by step
  desc: Specification of a design with the native pipe, built by the design functions
  contents:
  - qdm_endpoint
  - qdm_sample_size
  - qdm_prior
  - qdm_criterion
  - qdm_external
  - qdm_control
  - qdm_tte
  - qdm_computation
  - qdm_build

- title: Operations
  desc: Decision for observed data, scenarios and operating characteristics of one or several designs, calibration of the thresholds, search of the sample size and decision boundaries
  contents:
  - qdm_decide
  - qdm_scenarios
  - qdm_oc
  - qdm_compare
  - qdm_calibrate
  - qdm_find_n
  - qdm_boundary

- title: Reports and R code
  desc: Reports of a design and its results for a study protocol, and the R code of a design
  contents:
  - show_report
  - show_code

- title: Priors
  desc: Prior distributions of each group
  contents:
  - prior_beta
  - prior_nix
  - prior_dirichlet
  - prior_niw
  - prior_gamma
  - prior_vague

- title: Data, external data and hypothetical controls
  desc: Summaries of the data of one group, external data borrowed through a power prior, and hypothetical controls
  contents:
  - data_binary
  - data_continuous
  - data_binary2
  - data_continuous2
  - data_tte
  - borrow
  - hypothetical

- title: Decision criteria
  desc: Criteria based on posterior and posterior predictive probabilities
  contents:
  - criterion_posterior
  - criterion_predictive
  - qdm_regions

- title: Distribution functions
  desc: Distribution functions and random generation used by the decision criteria
  contents:
  - pbetadiff
  - pbetabinomdiff
  - ptdiff
  - psurvdiff
  - phazardratio
  - cellprob_binary2
  - rdirichlet

- title: Print, format, plot and conversion methods
  contents:
  - starts_with("print.")
  - starts_with("format.")
  - starts_with("plot.")
  - starts_with("as.data.frame.")

articles:
- title: Getting started
  navbar: ~
  contents:
  - overview
  - pipe
  - planning

- title: One endpoint
  navbar: One endpoint
  contents:
  - single-binary
  - single-continuous
  - time-to-event

- title: Two endpoints
  navbar: Two endpoints
  contents:
  - two-binary
  - two-continuous

- title: Version 0.1.0
  navbar: Version 0.1.0
  contents:
  - migration

